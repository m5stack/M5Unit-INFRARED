description: Library for M5Stack UNIT INFRARED using M5UnitUnified.
url: https://github.com/m5stack/M5Unit-INFRARED
issues: https://github.com/m5stack/M5Unit-INFRARED/issues
license: MIT
version: "0.2.0"

dependencies:
  idf: ">=5.0"
  m5stack/M5UnitUnified:
    git: https://github.com/m5stack/M5UnitUnified.git
    version: feature/esp-idf-native-support

targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32p4

files:
  exclude:
    - "docs/**"
    - "examples/**"
    - "test/**"
    - "boards/**"
    - ".github/**"
    - "platformio.ini"
    - "library.json"
    - "library.properties"
